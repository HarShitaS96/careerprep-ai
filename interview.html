<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interview Preparation | CareerPrep AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="logo">CareerPrep AI</a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="interview.html" class="active">Interview Preparation</a>
        <a href="explore.html">Explore Career</a>
    </div>
</nav>

<main class="page-container">
<section class="setup-card">
    <h1>Set Up Your Interview</h1>
    <p class="helper-text">Choose your preferences to personalize your practice.</p>

    <form id="settingsForm">
        <label for="stream">Career Stream</label>
        <select id="stream" required>
            <option value="">Select your stream</option>
            <option>IT & Technology</option>
            <option>Engineering</option>
            <option>BPO & Customer Operations</option>
            <option>Business & Corporate</option>
        </select>

        <label for="role">Target Role</label>
        <select id="role" required disabled>
            <option value="">Select your role</option>
        </select>

        <label for="experience">Experience Level</label>
        <select id="experience" required disabled>
            <option value="">Select experience</option>
            <option>Fresher</option>
            <option>0–2 years</option>
            <option>3–5 years</option>
            <option>6–10 years</option>
            <option>10+ years</option>
        </select>

        <label for="interviewType">Interview Type</label>
        <select id="interviewType" required>
            <option value="">Select interview type</option>
            <option>Technical</option>
            <option>HR / Behavioral</option>
            <option>Managerial</option>
            <option>Mixed</option>
        </select>

        <label for="difficulty">Difficulty</label>
        <select id="difficulty" required>
            <option value="">Select difficulty</option>
            <option>Basic</option>
            <option>Medium</option>
            <option>Hard</option>
            <option>As per Experience</option>
        </select>

        <label for="duration">Duration</label>
        <select id="duration" required>
            <option value="">Select duration</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes</option>
        </select>

        <label for="camera">Camera Preference</label>
        <select id="camera" required>
            <option value="">Select preference</option>
            <option>Camera ON</option>
            <option>Camera OFF (voice only)</option>
        </select>

        <button type="submit" class="card-button">Continue</button>
        <p id="settingsMessage" class="helper-text" aria-live="polite"></p>
    </form>
</section>
</main>

<script>
const roleOptions = {
    "IT & Technology": [
        "SAP HANA Consultant",
        "Software Developer",
        "Data Analyst",
        "Data Engineer",
        "Software Tester / QA Engineer",
        "Business Analyst",
        "DevOps Engineer",
        "Project Manager"
    ],
    "Engineering": [
        "Mechanical Engineer",
        "Civil Engineer",
        "Electrical Engineer",
        "Electronics Engineer",
        "Quality Engineer",
        "Project Engineer"
    ],
    "BPO & Customer Operations": [
        "Customer Support Executive",
        "Technical Support Executive",
        "Team Leader",
        "Quality Analyst",
        "Operations Manager"
    ],
    "Business & Corporate": [
        "Business Analyst",
        "Project Manager",
        "HR Executive",
        "Financial Analyst",
        "Marketing Executive",
        "Operations Manager"
    ]
};

const stream = document.getElementById("stream");
const role = document.getElementById("role");
const experience = document.getElementById("experience");

function resetSelect(select, placeholder) {
    select.innerHTML = "";
    const option = document.createElement("option");
    option.value = "";
    option.textContent = placeholder;
    select.appendChild(option);
}

stream.addEventListener("change", function() {
    resetSelect(role, "Select your role");
    resetSelect(experience, "Select experience");
    role.disabled = true;
    experience.disabled = true;

    if (stream.value) {
        roleOptions[stream.value].forEach(function(name) {
            const option = document.createElement("option");
            option.value = name;
            option.textContent = name;
            role.appendChild(option);
        });
        role.disabled = false;
    }
});

role.addEventListener("change", function() {
    resetSelect(experience, "Select experience");
    experience.disabled = !role.value;
});

document.getElementById("settingsForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const settings = {
        stream: stream.value,
        role: role.value,
        experience: experience.value,
        interviewType: document.getElementById("interviewType").value,
        difficulty: document.getElementById("difficulty").value,
        duration: document.getElementById("duration").value,
        camera: document.getElementById("camera").value
    };

    try {
        sessionStorage.setItem("careerPrepSettings", JSON.stringify(settings));
        window.location.href = "intro.html";
    } catch (error) {
        document.getElementById("settingsMessage").textContent =
            "Unable to save your settings. Please check your browser and try again.";
    }
});
</script>
</body>
</html>
