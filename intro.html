<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Introduction | CareerPrep AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">CareerPrep AI</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="interview.html" class="active">Interview Preparation</a>
            <a href="explore.html">Explore Career</a>
        </div>
    </nav>

    <main class="page-container">
        <section class="setup-card">
            <h1>Let's Get to Know You</h1>
            <p class="helper-text">
                Before your interview begins, tell us a little about yourself.
                This helps us personalize your interview experience.
            </p>

            <form id="introForm">
                <label for="candidateName">Full Name</label>
                <input
                    type="text"
                    id="candidateName"
                    placeholder="Enter your name"
                    required
                >

                <label for="education">Education</label>
                <input
                    type="text"
                    id="education"
                    placeholder="e.g. B.Tech in Computer Science"
                    required
                >

                <label for="experienceDetails">Work Experience</label>
                <textarea
                    id="experienceDetails"
                    rows="3"
                    placeholder="Briefly describe your experience, or mention that you are a fresher."
                    required
                ></textarea>

                <label for="skills">Key Skills</label>
                <textarea
                    id="skills"
                    rows="3"
                    placeholder="e.g. SQL, Python, communication, problem-solving"
                    required
                ></textarea>

                <label for="introduction">Introduce Yourself</label>
                <textarea
                    id="introduction"
                    rows="5"
                    placeholder="Tell us about yourself, your background, experience and career goals."
                    required
                ></textarea>

                <p class="helper-text">
                    Take your time. You can prepare your introduction here
                    before practising it aloud.
                </p>

                <button type="submit" class="card-button">
                    Continue to Interview
                </button>

                <p id="introMessage" class="helper-text" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        document.getElementById("introForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const candidate = {
                name: document.getElementById("candidateName").value.trim(),
                education: document.getElementById("education").value.trim(),
                experience: document.getElementById("experienceDetails").value.trim(),
                skills: document.getElementById("skills").value.trim(),
                introduction: document.getElementById("introduction").value.trim()
            };

            if (Object.values(candidate).some(value => !value)) {
                document.getElementById("introMessage").textContent =
                    "Please complete all fields before continuing.";
                return;
            }

            try {
                sessionStorage.setItem("careerPrepCandidate", JSON.stringify(candidate));
                document.getElementById("introMessage").textContent =
                    "Your introduction is ready. The actual AI interview will be connected in a later step.";
            } catch (error) {
                document.getElementById("introMessage").textContent =
                    "Your browser could not save this information. Please try again.";
            }
        });
    </script>

</body>
</html>
