
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Practice | CareerPrep AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .interview-room {
            max-width: 850px;
            margin: 40px auto;
        }
        .question-box {
            background: #f7f8fc;
            border: 1px solid #e7e9f2;
            border-radius: 14px;
            padding: 24px;
            margin: 24px 0;
        }
        .question-text {
            font-size: 22px;
            line-height: 1.5;
        }
        .answer-input {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            border: 1px solid #d9dce8;
            border-radius: 10px;
            font: inherit;
            margin: 12px 0 18px;
        }
        .progress-track {
            height: 8px;
            background: #e7e9f2;
            border-radius: 10px;
            overflow: hidden;
            margin: 18px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0;
            background: #5145d9;
        }
        .room-note {
            color: #626b7d;
            line-height: 1.6;
        }
        .room-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .room-actions button {
            cursor: pointer;
            border: none;
        }
        .secondary-action {
            background: #ecebff;
            color: #5145d9;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">CareerPrep AI</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="interview.html" class="active">Interview Preparation</a>
            <a href="explore.html">Explore Career</a>
        </div>
    </nav>

    <main class="page-container interview-room">
        <section class="setup-card">
            <h1>Interview Practice Room</h1>
            <p id="welcome" class="room-note">Your practice interview is ready.</p>
            <p id="questionCount">Question 1 of 5</p>

            <div class="progress-track">
                <div id="progressFill" class="progress-fill"></div>
            </div>

            <div class="question-box">
                <p id="questionNumber">QUESTION 1</p>
                <h2 id="questionText" class="question-text">
                    Tell me about yourself.
                </h2>
            </div>

            <form id="answerForm">
                <label for="answerInput">Your Answer</label>
                <textarea
                    id="answerInput"
                    class="answer-input"
                    rows="7"
                    placeholder="Type your answer here..."
                    required
                ></textarea>

                <p id="message" class="room-note" aria-live="polite"></p>

                <div class="room-actions">
                    <button type="submit" class="card-button" id="nextButton">
                        Save Answer & Continue
                    </button>
                    <button type="button" class="secondary-action" id="exitButton">
                        Exit Practice
                    </button>
                </div>
            </form>

            <p class="room-note">
                This is a sample practice interview. AI-generated questions and
                automated feedback will be added in a later step.
            </p>
        </section>
    </main>

    <script>
        const questions = [
            "Tell me about yourself, including your education, experience and key skills.",
            "What are your strongest skills, and how have you used them?",
            "Describe a challenging problem you faced and how you solved it.",
            "Tell me about a time you worked with others to achieve a goal.",
            "Why are you interested in this role, and what would you like to learn next?"
        ];

        let currentQuestion = 0;
        let answers = [];

        const answerInput = document.getElementById("answerInput");
        const message = document.getElementById("message");

        try {
            const candidate = JSON.parse(
                sessionStorage.getItem("careerPrepCandidate") || "null"
            );

            if (candidate && candidate.name) {
                document.getElementById("welcome").textContent =
                    "Good luck, " + candidate.name + "! Let's begin.";
            }

            const savedAnswers = JSON.parse(
                sessionStorage.getItem("careerPrepAnswers") || "[]"
            );

            if (Array.isArray(savedAnswers)) {
                answers = savedAnswers;
            }
        } catch (error) {
            answers = [];
        }

        function showQuestion() {
            document.getElementById("questionNumber").textContent =
                "QUESTION " + (currentQuestion + 1);

            document.getElementById("questionText").textContent =
                questions[currentQuestion];

            document.getElementById("questionCount").textContent =
                "Question " + (currentQuestion + 1) + " of " + questions.length;

            document.getElementById("progressFill").style.width =
                (currentQuestion / questions.length * 100) + "%";

            answerInput.value = answers[currentQuestion] || "";
            message.textContent = "";

            document.getElementById("nextButton").textContent =
                currentQuestion === questions.length - 1
                    ? "Finish Practice"
                    : "Save Answer & Continue";
        }

        document.getElementById("answerForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const answer = answerInput.value.trim();

            if (!answer) {
                message.textContent = "Please type your answer before continuing.";
                return;
            }

            answers[currentQuestion] = answer;

            try {
                sessionStorage.setItem("careerPrepAnswers", JSON.stringify(answers));
            } catch (error) {
                message.textContent = "Unable to save your answer. Please try again.";
                return;
            }

            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                showQuestion();
            } else {
                document.getElementById("progressFill").style.width = "100%";
                window.location.href = "results.html";
            }
        });

        document.getElementById("exitButton").addEventListener("click", function() {
            if (confirm("Exit this practice interview?")) {
                window.location.href = "interview.html";
            }
        });

        showQuestion();
    </script>

</body>
</html>
